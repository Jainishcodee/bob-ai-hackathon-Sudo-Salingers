[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos"
version = "0.1.0"
description = "Pharos — drug safety signal detection over FDA FAERS and ICH M4 CTD submission-readiness checking, with an MCP server for IBM Bob."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "plotly>=5.20"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0"]

[project.scripts]
pharos = "pharos.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pharos*", "mcp_server*"]

[tool.setuptools.package-data]
pharos = ["ctd/data/*.yaml", "faers/cache/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
