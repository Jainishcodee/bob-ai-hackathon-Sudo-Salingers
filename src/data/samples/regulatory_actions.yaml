# Real regulatory / scientific milestones for the demo drugs, used as markers on the
# signal-emergence timeline. Dates are public record (FDA press releases, EMA decisions,
# journal publication dates). `headline_pair` is the reaction the timeline demo uses.
#
# openFDA FAERS data begins 2004, so only actions after 2004 can be evaluated prospectively.

drugs:
  ROSIGLITAZONE:
    - date: 2007-05-21
      label: "Nissen & Wolski meta-analysis (NEJM) reports increased MI risk"
      source: "N Engl J Med 2007;356:2457-71"
    - date: 2007-11-14
      label: "FDA adds boxed warning for myocardial ischaemia"
      source: "FDA Safety Alert, 14 Nov 2007"
    - date: 2010-09-23
      label: "FDA restricts use (REMS); EMA suspends marketing authorisation"
      source: "FDA News Release, 23 Sep 2010"
    - date: 2013-11-25
      label: "FDA lifts restrictions after RECORD trial re-adjudication"
      source: "FDA Drug Safety Communication, 25 Nov 2013"

  ROFECOXIB:
    - date: 2004-09-30
      label: "Merck withdraws Vioxx worldwide (APPROVe trial)"
      source: "FDA Public Health Advisory, 30 Sep 2004"

  VALDECOXIB:
    - date: 2004-12-09
      label: "FDA boxed warning: serious skin reactions (SJS/TEN)"
      source: "FDA Talk Paper, 9 Dec 2004"
    - date: 2005-04-07
      label: "Pfizer withdraws Bextra at FDA request"
      source: "FDA Alert, 7 Apr 2005"

  SIBUTRAMINE:
    - date: 2009-11-20
      label: "FDA early communication on SCOUT trial cardiovascular findings"
      source: "FDA Early Communication, 20 Nov 2009"
    - date: 2010-01-21
      label: "EMA recommends suspension; FDA adds contraindication"
      source: "EMA press release, 21 Jan 2010"
    - date: 2010-10-08
      label: "Abbott withdraws Meridia from US market at FDA request"
      source: "FDA News Release, 8 Oct 2010"

  PROPOXYPHENE:
    - date: 2009-06-25
      label: "EMA recommends withdrawal across the EU"
      source: "EMA press release, 25 Jun 2009"
    - date: 2010-11-19
      label: "FDA requests withdrawal after QT-prolongation study"
      source: "FDA News Release, 19 Nov 2010"

  CERIVASTATIN:
    - date: 2001-08-08
      label: "Bayer withdraws Baycol/Lipobay (rhabdomyolysis)"
      source: "FDA Talk Paper, 8 Aug 2001"

# Pairs the demo and `build-cache` warm up. Reaction terms are MedDRA preferred terms as in FAERS.
headline_pairs:
  - drug: ROSIGLITAZONE
    aliases: [AVANDIA]
    reaction: MYOCARDIAL INFARCTION
    end_year: 2013
    # Vioxx litigation reports were ~70% of ALL MI reports in FAERS in 2005–06 and masked this signal.
    exclude: [ROFECOXIB, VIOXX]
  - drug: SIBUTRAMINE
    aliases: [MERIDIA, REDUCTIL]
    reaction: CEREBROVASCULAR ACCIDENT
    end_year: 2012
  - drug: PROPOXYPHENE
    aliases: [DARVON, DARVOCET]
    reaction: CARDIAC ARREST
    end_year: 2012
  - drug: VALDECOXIB
    aliases: [BEXTRA]
    reaction: STEVENS-JOHNSON SYNDROME
    end_year: 2008
  - drug: ROFECOXIB
    aliases: [VIOXX]
    reaction: MYOCARDIAL INFARCTION
    end_year: 2010
