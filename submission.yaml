submission:
  title: "Pharos — Drug Safety Signal Detector & Regulatory Submission Readiness Checker"   # REQUIRED

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    FDA's FAERS database holds 20M+ adverse-event reports and grows by over a million a year;
    pharmacovigilance scientists cannot read them, so drug-safety signals — like the cardiovascular
    risk of Vioxx that preceded 27,000+ heart attacks — sit undetected in plain sight. Separately,
    regulatory affairs teams assemble 100,000-page approval dossiers by hand against the five-module
    ICH M4 CTD structure, where one missing section triggers a refuse-to-file that costs 6–12 months
    and $50–100M. Both problems share a root cause: too much structured data for manual review.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Pharos is a two-mode drug-safety engine: Mode 1 runs standard disproportionality statistics
    (PRR, ROR with 95% CI, chi-square, Evans 2001 criteria) live against real openFDA FAERS data,
    ranks and clusters signals by organ system, and retrospectively flags every withdrawn drug in our
    demo set; Mode 2 audits a dossier outline against a machine-readable ICH M4 CTD checklist (69
    sections, weighted by regulatory criticality) and produces a ranked gap report. Pharos is the
    evidence layer; IBM Bob, connected through the Pharos MCP server (6 tools, 2 prompt templates), is
    the reasoning layer that turns the numbers into a signal-assessment memo or a remediation plan.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Live disproportionality analysis over 20.7M real FDA FAERS reports via openFDA: PRR, ROR (95% CI), Yates chi-square, Evans 2001 signal criteria, Haldane correction — 36 unit tests against hand-computed values"
    - "Signal emergence timeline with masking detection & correction: rebuilds the 2×2 table per year (FDA receive date) and detects which drug dominates a reaction's reports. Real result — Vioxx litigation = 68–72% of all MI reports in 2005–06 masked Avandia's MI signal; standard PRR flags it in 2008 (after FDA acted), Vioxx-excluded PRR flags it in 2006, a year BEFORE the Nissen meta-analysis"
    - "Retrospective validation on real withdrawals: Vioxx (rofecoxib) → myocardial infarction n=17,981, PRR 52 [51.5–52.8]; cardiovascular organ-system cluster of 8 signals — plus Avandia, Baycol, Bextra, Meridia, Darvon in the demo set"
    - "ICH M4 CTD submission-readiness checker: 69-section machine-readable checklist with required/optional flags and criticality weights; per-module weighted scores; gaps ranked critical/major/minor with 'why it matters'; detects collapsed parent sections and unrecognised entries"
    - "IBM Bob MCP server (7 tools: scan_signals, compute_prr, cluster_signals_by_organ_system, search_reports, signal_emergence_timeline, check_ctd_dossier, get_ctd_spec + 2 prompt templates) — Bob writes the narrative, Pharos supplies the evidence"
    - "Streamlit dashboard + Typer CLI, administrative-term filtering (DRUG INEFFECTIVE etc.), curated MedDRA SOC clustering, on-disk openFDA cache with PHAROS_OFFLINE mode so the demo survives no network"

  tech_stack:
    languages: ["Python"]                                          # REQUIRED
    frameworks: ["Streamlit", "Typer", "Plotly", "pandas", "httpx", "pytest"]
    ibm_technologies: ["IBM Bob (development: Plan/Agent modes, /review)", "IBM Bob MCP integration (runtime: Pharos MCP server)"]
    databases: ["openFDA FAERS API (FDA Adverse Event Reporting System, 20.7M reports)", "JSON disk cache"]
    other: ["Model Context Protocol (MCP) — FastMCP", "ICH M4 CTD checklist (YAML)", "GitHub Actions (template validator)"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The Avandia timeline (src/pharos/signals/timeline.py). Run `python -m pharos timeline rosiglitazone
    "myocardial infarction" --alias avandia -x rofecoxib -x vioxx --to 2013`: Pharos rebuilds the 2×2 table
    for every year from real FDA data, shows the standard PRR screen flagging Avandia's MI signal only in 2008
    — after the FDA had acted — then shows WHY: Vioxx litigation reports were 68–72% of every MI report in
    FAERS in 2005–06 (masking). Excluding them, the signal is present in 2006, a year before the Nissen
    meta-analysis. We did not expect this; the data corrected our first assumption, and the tool now makes
    masking visible and correctable for any drug. All statistics are the ones regulators use (Evans 2001),
    unit-tested against hand-computed values (50 tests), and exposed to IBM Bob over MCP so Bob can verify
    each signal with an exact query, pull real cases, establish when it emerged, and write the assessment.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    (1) The Vioxx scan is a retrospective validation, not pre-withdrawal detection: openFDA data starts
    in 2004 and Vioxx was withdrawn in September 2004; its FAERS counts are inflated by litigation-driven
    reporting. The Avandia timeline IS a prospective statement (it uses only reports FDA had by each year-end),
    but the masking drug was chosen by an analyst reading Pharos's masking report, not by an automated rule,
    and the standard screen alone flagged Avandia only in 2008 — we claim the correction, not that naive PRR
    beats regulators. (2) Disproportionality shows reporting association, not causation; Pharos is a triage
    tool and says so.
    (3) MedDRA is licensed, so organ-system clustering uses a curated ~300-term map plus keyword heuristics
    and is labelled heuristic. (4) Mode 2 is deliberately lighter than Mode 1: it checks structural
    completeness of an outline, not the scientific adequacy of section contents; Module 1 (regional) is
    simplified to the main US/EU items. (5) Keyless openFDA access caps count queries at 500 terms and
    1,000 requests/day; a free API key lifts both. (6) Bob's narrative output depends on the model; the MCP
    server instructions constrain it to always state n, PRR, CI and chi-square and to avoid causal language.

